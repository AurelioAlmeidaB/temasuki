name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar código e aplicação no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ec2-54-163-192-149.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/temasuki
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            bash deploy.sh
